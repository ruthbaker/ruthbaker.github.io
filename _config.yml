# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Baker Group
name: Quantitative approaches to cell and developmental biology
email: ruth.baker@maths.ox.ac.uk
logo: "/assets/images/logo.jpg"
description: >- # this means to ignore newlines until "baseurl:"
  Professor of Applied Mathematics at the Mathematical Institute, University of Oxford. 
  Focus on developing and applying mathematical, statistical and machine learning approaches
  to key problems in cell and developmental biology.
url: https://ruthbaker.github.io.
github_username: ruthbaker
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: Europe/London 
locale: en-GB

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Ruth Baker"
  avatar : "/assets/images/e40c2381b41c482b950c695d4ce0c808-copy-265x300.jpeg"
  bio    : "Developing and applying mathematics for new biological understanding."
  links:
    - label: "Mathematical Institute website"
      icon: "fas fa-fw fa-link"
      url: "https://www.maths.ox.ac.uk/people/ruth.baker"
    - label: "BlueSky"
      icon: "fab fa-fw fa-square-bluesky"
      url: "https://bsky.app/profile/profruthbaker.bsky.social"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ruthbaker"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ruth-baker-76117135/"

footer:
  links:
    - label: "Mathematical Institute website"
      icon: "fas fa-fw fa-link"
      url: "https://www.maths.ox.ac.uk/people/ruth.baker"
    - label: "BlueSky"
      icon: "fab fa-fw fa-square-bluesky"
      url: "https://bsky.app/profile/profruthbaker.bsky.social"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ruthbaker"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ruth-baker-76117135/"

